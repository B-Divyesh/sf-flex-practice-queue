<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f1f5f0">
    <meta name="description" content="The requested Flex Practice Queue page was not found.">
    <title>Page not found — Flex Practice Queue</title>
    <style>
      :root { color: #102a43; background: #f1f5f0; font-family: "Avenir Next", "Segoe UI", Arial, sans-serif; line-height: 1.5; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; margin: 0; background-color: #f1f5f0; background-image: linear-gradient(rgba(7,89,133,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(7,89,133,.06) 1px, transparent 1px); background-size: 24px 24px; }
      header, main, footer { max-width: 1000px; margin: auto; border-inline: 1px solid rgba(7,89,133,.28); }
      header { padding: 20px 28px; border-bottom: 1px solid rgba(7,89,133,.28); font: 700 14px/1.05 Rockwell, Georgia, serif; letter-spacing: .04em; text-transform: uppercase; }
      main { min-height: 68vh; display: grid; align-content: center; padding: 56px 48px; }
      .label { color: #075985; font-size: .76rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { max-width: 10ch; margin: 12px 0 20px; color: #063b5c; font: clamp(2.6rem, 7vw, 4.8rem)/.98 Rockwell, Georgia, serif; letter-spacing: -.045em; }
      p { max-width: 38rem; font-size: 1.1rem; }
      a { display: inline-flex; width: fit-content; min-height: 46px; align-items: center; justify-content: center; padding: 10px 18px; color: #fff; background: #063b5c; border: 2px solid #063b5c; box-shadow: 4px 4px 0 rgba(6,59,92,.16); font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #c53d2f; outline-offset: 3px; }
      footer { padding: 28px; border-top: 2px solid #063b5c; font-size: .82rem; }
      @media (max-width: 760px) { header { padding: 16px 20px; } main { min-height: 62vh; padding: 48px 20px; } footer { padding: 24px 20px; } }
    </style>
  </head>
  <body>
    <header>Flex Practice<br>Queue</header>
    <main>
      <p class="label">Drawing not found · 404</p>
      <h1>This practice sheet is missing</h1>
      <p>The address does not point to a page in this app.</p>
      <a href="/">Return to the workbench</a>
    </main>
    <footer>Flex Practice Queue — optional practice beside your flashcard schedule.</footer>
  </body>
</html>
